name: Validate elicitation whitespace

on:
  push:
    branches: [elicitation-validation]

permissions:
  contents: read

concurrency:
  group: elicitation-validation
  cancel-in-progress: true

jobs:
  components:
    if: github.repository == 'wozhenbang2004/opencode'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CI: true
      PLAYWRIGHT_STORIES_PORT: 6282
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      TARGET: preserves elicitation message whitespace as plain text and wraps long lines
      SPEC: component-tests/session-question-dock.spec.ts
      CSS: packages/app/src/session/requests/session-elicitation-dock.css
      BASE: 149767cafe836251914d1cb248960ce97721c268

    steps:
      - name: Checkout reviewed commits
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify reviewed base
        run: test "$(git rev-parse HEAD~2)" = "$BASE"

      - name: Setup repository dependencies and Bun cache
        uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.4"

      # The composite sets Node 24 internally; pin the browser-test runtime afterwards.
      - name: Pin Node for Playwright
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.15.0"

      - name: Verify tool versions
        run: |
          test "$(bun --version)" = 1.4.4
          test "$(node --version)" = v24.15.0
          node -e 'if (require("./package.json").workspaces.catalog["@playwright/test"] !== "1.60.0") process.exit(1)'
          cd packages/app
          test "$(bunx --no-install playwright --version)" = "Version 1.60.0"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.60.0-chromium

      - name: Install Chromium system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx --no-install playwright install-deps chromium

      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx --no-install playwright install chromium

      - name: Baseline must fail at the whitespace assertion
        run: |
          mkdir -p validation-results
          git show "$BASE:$CSS" > "$CSS"
          trap 'git restore -- "$CSS"' EXIT
          rm -rf packages/stories/node_modules/.vite
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/validation-results/baseline.json"
          set +e
          (cd packages/app && bun run test:components -- "$SPEC" --grep "$TARGET" --workers=2 --retries=0 --reporter=line,json) 2>&1 | tee validation-results/baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          node --input-type=module <<'JS'
          import assert from "node:assert/strict"
          import fs from "node:fs"
          const report = JSON.parse(fs.readFileSync("validation-results/baseline.json", "utf8"))
          const specs = (suites) => suites.flatMap((suite) => [...suite.specs, ...specs(suite.suites ?? [])])
          const cases = specs(report.suites)
          assert.equal(report.errors.length, 0)
          assert.equal(cases.length, 1)
          assert.equal(cases[0].title, process.env.TARGET)
          assert.equal(cases[0].tests.length, 1)
          const test = cases[0].tests[0]
          assert.equal(test.expectedStatus, "passed")
          assert.equal(test.status, "unexpected")
          assert.equal(test.results.length, 1)
          const result = test.results[0]
          assert.equal(result.status, "failed")
          assert.equal(result.retry, 0)
          assert.equal(result.errors.length, 1)
          const lines = fs.readFileSync(`packages/app/${process.env.SPEC}`, "utf8").split("\n")
          const start = lines.findIndex((line) => line.includes(`story("${process.env.TARGET}"`))
          assert.ok(start >= 0)
          const assertion = lines.findIndex((line, index) => index > start && line.includes("await expect.poll(() => text.innerText()).toBe(message)"))
          assert.equal(result.errorLocation.line, assertion + 1)
          assert.ok(result.errorLocation.file.replaceAll("\\", "/").endsWith(process.env.SPEC))
          const message = JSON.parse(lines[start + 4].trim())
          const error = result.error.message.replace(/\u001b\[[0-9;]*m/g, "")
          assert.ok(error.includes("expect(received).toBe(expected)"))
          assert.ok(error.includes(message.replace(/\s+/g, " ")))
          console.log("Confirmed: the visible message collapsed whitespace; not a browser/setup failure.")
          JS

      - name: Candidate must pass
        run: |
          git diff --exit-code -- "$CSS"
          rm -rf packages/stories/node_modules/.vite
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/validation-results/candidate.json"
          (cd packages/app && bun run test:components -- "$SPEC" --grep "$TARGET" --workers=2 --retries=0 --reporter=line,json) 2>&1 | tee validation-results/candidate.log
          node -e 'const r = require("./validation-results/candidate.json"); if (r.errors.length || r.stats.expected !== 1 || r.stats.unexpected || r.stats.flaky || r.stats.skipped) process.exit(1)'

      - name: Repeat the affected spec ten times without retries
        timeout-minutes: 30
        run: |
          export PLAYWRIGHT_JSON_OUTPUT_NAME="$GITHUB_WORKSPACE/validation-results/repeat.json"
          (cd packages/app && bun run test:components -- "$SPEC" --workers=2 --repeat-each=10 --retries=0 --reporter=line,json) 2>&1 | tee validation-results/repeat.log

      - name: Preserve text evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: elicitation-validation-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            validation-results/*.json
            validation-results/*.log
          if-no-files-found: warn
          retention-days: 7
